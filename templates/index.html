<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elekeeper Solar</title>

    <link rel="icon" type="image/png" sizes="any" href="./logo.png?v=4">
    <link rel="apple-touch-icon" href="./logo.png">
    <link rel="stylesheet" href="./index.css?v=2">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="brand">
                <img src="./logo.png" alt="Elekeeper Solar" class="logo">

                <div>
                    <h1>Elekeeper Solar</h1>
                    <p class="subtitle">
                        Monitoramento de Geração em Tempo Real
                    </p>
                </div>
            </div>

            <div class="header-actions">
                <span id="status-badge" class="status-badge">
                    <span class="status-dot"></span>
                    Carregando...
                </span>

                <button onclick="atualizarDadosManualmente()" id="btn-refresh" class="refresh-button">
                    <i class="fa-solid fa-arrows-rotate" id="refresh-icon"></i>
                    Atualizar Agora
                </button>
            </div>
        </header>

        <main class="dashboard-grid">

            <!-- Geração diária -->
            <div class="card card-hoje">
                <div class="card-icon">
                    <i class="fa-solid fa-sun"></i>
                </div>

                <p class="card-title">Gerado Hoje</p>

                <div class="card-value">
                    <span id="val-hoje" class="value">0.0</span>
                    <span class="unit">kWh</span>
                </div>

                <div class="card-description active-production">
                    <i class="fa-solid fa-bolt"></i>
                    Produção diária ativa
                </div>
            </div>

            <!-- Geração mensal -->
            <div class="card card-mes">
                <div class="card-icon">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>

                <p class="card-title">Gerado no Mês</p>

                <div class="card-value">
                    <span id="val-mes" class="value">0.0</span>
                    <span class="unit">kWh</span>
                </div>

                <div class="card-description">
                    Acumulado do período atual
                </div>
            </div>

            <!-- Geração total -->
            <div class="card card-total">
                <div class="card-icon">
                    <i class="fa-solid fa-chart-line"></i>
                </div>

                <p class="card-title">Eletricidade Total</p>

                <div class="card-value">
                    <span id="val-total" class="value">0.0</span>
                    <span class="unit">kWh</span>
                </div>

                <div class="card-description">
                    Histórico total desde a instalação
                </div>
            </div>

        </main>

        <footer class="footer">
            <div>
                Última sincronização com Elekeeper:
                <span id="val-update">-</span>
            </div>

            <div class="online-status">
                <i class="fa-solid fa-shield-halved"></i>
                Monitoramento Online
            </div>
        </footer>

    </div>

    <script>
        // Busca os dados atualizados da API Python
        async function carregarDadosDashboard() {
            try {
                const resposta = await fetch('/api/dados');
                const dados = await resposta.json();

                document.getElementById('val-hoje').innerText = dados.hoje;
                document.getElementById('val-mes').innerText = dados.mes;
                document.getElementById('val-total').innerText = dados.total;
                document.getElementById('val-update').innerText = dados.ultima_atualizacao;

                const badge = document.getElementById('status-badge');

                badge.innerHTML = `
                    <span class="status-dot status-animated"></span>
                    ${dados.status}
                `;

            } catch (erro) {
                console.error("Erro ao buscar dados da API local:", erro);
            }
        }

        // Atualização manual dos dados
        async function atualizarDadosManualmente() {
            const btn = document.getElementById('btn-refresh');
            const icone = document.getElementById('refresh-icon');

            btn.disabled = true;
            icone.classList.add('fa-spin');

            try {
                const resposta = await fetch('/api/atualizar', {
                    method: 'POST'
                });

                const resultado = await resposta.json();

                if (resultado.sucesso) {
                    carregarDadosDashboard();
                } else {
                    alert("Falha ao comunicar com os servidores da Elekeeper. Verifique os logs do Python.");
                }

            } catch (erro) {
                alert("Erro ao processar requisição.");

            } finally {
                btn.disabled = false;
                icone.classList.remove('fa-spin');
            }
        }

        // Atualização automática a cada 30 segundos
        setInterval(carregarDadosDashboard, 30000);

        // Carrega os dados ao abrir a página
        window.onload = carregarDadosDashboard;
    </script>

</body>

</html>
